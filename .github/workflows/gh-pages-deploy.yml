name: Portifolio Deploy on GH-Pages
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-on-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run deploy